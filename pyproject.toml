[project]
name = "python-rust"
version = "0.1.0"
description = "Proof of concept: a Python package with a native Rust core (PyO3 + maturin)"
readme = "README.md"
authors = [
    { name = "Erik", email = "erik.ytterman@phaseshift.se" }
]
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/python_rust", "tests", "examples"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.maturin]
module-name = "python_rust._core"
python-packages = ["python_rust"]
python-source = "src"

[tool.uv]
# Build in the project venv: an isolated build env gets a new path every time,
# which makes pyo3 recompile from scratch on each Rust change
no-build-isolation-package = ["python-rust"]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "mypy>=2.4.0",
    "py-spy>=0.4.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "rust-just>=1.59.0",
]
