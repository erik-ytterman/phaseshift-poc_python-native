[package]
name = "python_native"
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85; u64::is_multiple_of needs 1.87
rust-version = "1.87"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
# No "extension-module" feature: maturin sets PYO3_BUILD_EXTENSION_MODULE instead, so the
# extension doesn't link libpython but `cargo test` binaries can (needed to call Python from Rust tests)
# "abi3-py313" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.13 (matches requires-python)
pyo3 = { version = "0.28.2", features = ["abi3-py313"] }
